<app-sidebar></app-sidebar>

<section class="home-section">
  <div class="wrapper">
    <div class="header">
      <h2>Add Task / Objective</h2>
      <p>Assign tasks and objectives to a specific project</p>
    </div>

    <!-- Task / Objective Form -->
    <form class="task-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="project">Select Project</label>
        <select id="project" name="project" [(ngModel)]="task.project" required>
          <option value="" disabled selected>Select a project</option>
          <option *ngFor="let project of projects" [value]="project.id">{{ project.name }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="title">Task/Objective Title</label>
        <input type="text" id="title" name="title" [(ngModel)]="task.title" placeholder="Enter task title" required>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description" [(ngModel)]="task.description" rows="4" placeholder="Enter detailed description..." required></textarea>
      </div>

      <div class="form-group">
        <label for="dueDate">Due Date</label>
        <input type="date" id="dueDate" name="dueDate" [(ngModel)]="task.dueDate" required>
      </div>

      <div class="form-group">
        <label for="priority">Priority</label>
        <select id="priority" name="priority" [(ngModel)]="task.priority" required>
          <option value="" disabled selected>Select priority</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>

      <div class="form-group">
        <label for="assignedPerson">Assigned Person (optional)</label>
        <input type="text" id="assignedPerson" name="assignedPerson" [(ngModel)]="task.assignedPerson" placeholder="Enter assigned person's name">
      </div>

      <button type="submit" class="submit-button">Add Task / Objective</button>
    </form>

    <!-- Task Summary (Future Enhancement Placeholder) -->
    <div class="task-summary">
      <h3>Task Summary</h3>
      <p>Tasks you've added will appear here...</p>
    </div>

    <!-- Notifications (Optional) -->
    <div class="notifications">
      <h3>Notifications</h3>
      <p>No notifications available.</p>
    </div>
  </div>
</section>
